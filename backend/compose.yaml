services:
  postgres:
    image: postgres:14
    container_name: postgres-brennand
    environment:
      POSTGRES_DB: projeto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    networks:
      - brennand-net

  backend:
    build: .
    container_name: backend-brennand
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/projeto
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
    depends_on:
      - postgres
    networks:
      - brennand-net

networks:
  brennand-net:
